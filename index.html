<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文章標題</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      line-height: 1.7;
      background: #f5f5f5;
      color: #222;
    }

    .page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background: #ffffff;
      min-height: 100vh;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      line-height: 1.3;
      margin: 16px 0 8px;
    }

    .subtitle {
      color: #666;
      font-size: 16px;
      margin: 0;
    }

    article {
      font-size: 18px;
    }

    article h2 {
      font-size: 24px;
      margin-top: 32px;
    }

    article p {
      margin-bottom: 18px;
    }

    .image-box {
      margin: 24px 0;
    }

    .image-box img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
    }

    .caption {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-top: 8px;
    }

    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
      color: #777;
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .page {
        padding: 14px;
      }

      h1 {
        font-size: 26px;
      }

      article {
        font-size: 16px;
      }

      article h2 {
        font-size: 21px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>這裡放文章標題</h1>
      <p class="subtitle">這裡可以放副標題或簡短說明</p>
    </header>

    <article>
      <p>
        這裡放你的文章開頭。你可以把這段文字換成自己的內容。
      </p>

      <div class="image-box">
        <img src="images/BlackRoof01.png" alt="黑色金屬屋頂受熱示意圖" />
        <div class="caption">黑色金屬屋頂受熱後，溫度升高並產生熱膨脹。</div>
      </div>

      <h2>第一段小標題</h2>
      <p>
        這裡放文章內容。這個版型會自動適應手機、平板和電腦螢幕。
      </p>

      <div class="image-box">
        <img src="images/BlackRoof02.png" alt="黑色屋頂高溫示意圖" />
        <div class="caption">黑色金屬屋頂在陽光下容易快速升溫。</div>
      </div>

      <h2>第二段小標題</h2>
      <p>
        你可以繼續放更多段落。圖片會自動縮放，不會超出手機螢幕。
      </p>

      <div class="image-box">
        <img src="images/BlackRoof03.jpg" alt="金屬熱脹冷縮示意圖" />
        <div class="caption">長期熱脹冷縮可能造成接縫鬆動與漏水。</div>
      </div>
          <div class="image-box">
        <img src="images/BlackRoof04.jpg" alt="屋頂漏水示意圖" />
        <div class="caption">多年高溫與雨水可能導致屋頂老化與滲漏。</div>
      </div>

      <div class="image-box">
        <img src="images/BlackRoof05.jpg" alt="白色屋頂降溫示意圖" />
        <div class="caption">將屋頂塗成白色可有效降低表面溫度。</div>
      </div>

      <div class="image-box">
        <img src="images/BlackRoof06.jpg" alt="遮陽帆布示意圖" />
        <div class="caption">使用遮陽帆布可減少陽光直接曝曬。</div>
      </div>

      <div class="image-box">
        <img src="images/BlackRoof07.jpg" alt="屋頂改善完成示意圖" />
        <div class="caption">簡單隔熱措施可延長金屬屋頂使用壽命。</div>
      </div>
    </article>

    <footer>
      © 2026 你的名字或網站名稱
    </footer>
  </div>
</body>
</html>
